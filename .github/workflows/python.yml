name: Python

on:
  pull_request:
    paths: ['packages/python/**', 'scripts/**', '.github/workflows/python.yml']
  push:
    branches: [main]
    paths: ['packages/python/**', 'scripts/**', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: packages/python/src:packages/python/tests
  OMP_NUM_THREADS: '1'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  verify:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv pip install --system -e packages/python
      - run: python -m unittest discover -s packages/python/tests -q
      - name: Run packaging regression tests
        run: python -m unittest scripts.test_package_smoke -v
      - run: uv build packages/python --wheel --out-dir "$RUNNER_TEMP/wsm-wheel"
      - name: Smoke-test installed wheel
        run: python scripts/package_smoke.py "$RUNNER_TEMP"/wsm-wheel/*.whl

  editing:
    name: CPU editing / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      WSM_REQUIRE_MODEL_TESTS: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Modal launcher must match its Python 3.12 image.
          - python-version: '3.12'
            extras: editing,trial
          - python-version: '3.13'
            extras: editing
          - python-version: '3.14'
            extras: editing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv pip install --system -e 'packages/python[${{ matrix.extras }}]' --torch-backend cpu
      - name: Verify the CPU editing stack is importable
        run: |
          python -c 'import torch, tokenizers, safetensors; from transformers import GPT2LMHeadModel; assert torch.version.cuda is None'
      - name: Run the full suite with trial dependencies
        if: matrix.python-version == '3.12'
        run: python -m unittest discover -s packages/python/tests -q
      - name: Run CPU editing tests
        if: matrix.python-version != '3.12'
        run: python -m unittest test_editing -v
