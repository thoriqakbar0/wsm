name: Python

on:
  pull_request:
    paths: ['packages/python/**', 'scripts/**', '.github/workflows/python.yml']
  push:
    branches: [main]
    paths: ['packages/python/**', 'scripts/**', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: packages/python/src:packages/python/tests
      OMP_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv pip install --system -e 'packages/python[editing,trial]' --torch-backend cpu
      - run: python -m unittest discover -s packages/python/tests -q
      - run: uv build packages/python --wheel
