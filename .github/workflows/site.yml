name: Site

on:
  pull_request:
    paths: ['site/**', 'docs/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/package-cloudflare.mjs
      - run: npm run deploy:check
      - uses: actions/upload-artifact@v4
        with:
          name: site-production
          path: site/.cloudflare/output/
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wsm.ta-0.com
    concurrency:
      group: site-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CF_SEND_TELEMETRY: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-production
          path: site/.cloudflare/output/
      - run: npx cf deploy --prebuilt --mode production
      - name: Verify public routes
        run: |
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 https://wsm.ta-0.com/ -o /tmp/wsm-home.html
          grep -q 'Weight Space Mods' /tmp/wsm-home.html
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 https://wsm.ta-0.com/docs/quickstart/ -o /dev/null
