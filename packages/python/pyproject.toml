[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightless-sdk"
version = "0.1.0"
description = "Weight-space experiments with bound evaluation evidence"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
integration = ["harbor==0.25.0", "verifiers==0.4.1", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["src"]
