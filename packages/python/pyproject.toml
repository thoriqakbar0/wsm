[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsm"
version = "0.1.0"
description = "WSM (Weight Space Modifiers): Python model weight editing"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wsm = "wsm.cli:main"

[project.optional-dependencies]
editing = ["torch", "transformers", "safetensors"]

[tool.setuptools.packages.find]
where = ["src"]
