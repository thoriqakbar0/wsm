[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsm"
version = "0.1.0"
description = "WSM (Weight Space Mods): Python model weight editing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/thoriqakbar0/wsm"
Documentation = "https://github.com/thoriqakbar0/wsm/blob/main/README.md"

[project.scripts]
wsm = "wsm.cli:main"

[project.optional-dependencies]
tinker = ["tinker==0.39.0"]
trial = ["modal==1.6.3", "tinker==0.39.0", "jinja2>=3.1.6"]
spindle = ["modal==1.6.3", "tinker==0.39.0", "jinja2>=3.1.6"]
editing = ["torch", "transformers", "safetensors"]

[tool.setuptools.packages.find]
where = ["src"]
